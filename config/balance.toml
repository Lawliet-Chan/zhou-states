# 数值配置
# 所有可调整的数值都在这里，改完重新运行即可生效，不需要改代码。
# 物品、行业、配方、建筑都用英文 id 引用，name 是显示用的中文名。

# 一回合为一个月，每季 months_per_season 个回合，一年 12 个回合。季节顺序即回合顺序
# 下面所有「每回合」的数值都是每月的量；人力（人 × 回合）也按月计
seasons = ["春", "夏", "秋", "冬"]
months_per_season = 3

[population]
# 消耗按每多少人计算
per_people = 100
# 技能槽上限
max_skills = 4
# 人群没有指定技能时的初始技能。没有人生下来什么都不会，新生的人口继承所在人群的技能槽
initial_skill = "farming"
# 技能槽中有 1/2/3/4 项技能时的专精度
specialization = [1.0, 0.85, 0.7, 0.6]
# 愉悦度满值时，每回合的人口增长率
growth_rate = 0.0066
# 愉悦度低于该值时人口不增长
growth_min_happiness = 400
# 愉悦度低于该值时人口开始外流
emigration_threshold = 200
# 人口外流时，每回合离开的比例
emigration_rate = 0.017
# 完全断粮时，每回合饿死的比例（按缺口比例折算）
starvation_rate = 0.017
# 消耗不足时，是否由府库补足
treasury_covers_shortfall = true

# 每 per_people 人每回合的消耗。goods 中任意一种都可以满足，按顺序扣除
[[population.consumption]]
name = "食物"
goods = ["grain", "fish", "meat"]
amount = 0.67

[[population.consumption]]
name = "盐"
goods = ["salt"]
amount = 0.33

[happiness]
max = 1000.0
# 每回合愉悦度向 target 回归的比例
target = 600.0
drift_rate = 0.035
# 整群人全部投入官营或营建时，每回合降低的愉悦度（按参与比例折算）
guan_penalty = 20.0
# 税率为 100% 时，每回合降低的愉悦度（按税率和被征税比例折算）
tax_penalty = 100.0
# 完全断粮时，每回合降低的愉悦度（按缺口比例折算）
hunger_penalty = 67.0
# 本回合举行祭祀时，所有人群增加的愉悦度
sacrifice_bonus = 20.0
# 藏富于民：全城民间财富的人均价值达到 wealth_full_per_person 时，
# 所有人群每回合增加 wealth_bonus 愉悦度；不足时按比例折算
wealth_bonus = 10.0
wealth_full_per_person = 0.2
# 人口超出居住上限一倍时，每回合降低的愉悦度（按超出比例折算）
crowding_penalty = 33.0
# 农忙：春播、秋收。会 busy_skill 的人在农忙时被派去做别的工事（种五谷以外的生产、营建、开垦、水利），
# 除了 guan_penalty 之外，每回合再降低这么多愉悦度（按被调走的比例折算）。春、夏、秋、冬
busy_skill = "farming"
busy_penalty = [20.0, 0.0, 20.0, 0.0]
# 愉悦度为 0 和满值时的产出倍率，中间线性插值
min_output_mult = 0.5
max_output_mult = 1.2

[shi]
# 「士」技能的 id
skill = "shi"
# 士人管理上限的基础值
base_capacity = 50.0
# 新任用士人的管理上限比例，随任职回合数提升到 1.0
new_capacity_ratio = 0.6
ramp_turns = 24
# 忠诚度为 0 时的管理上限倍率，忠诚度满值时为 1.0
loyalty_min_mult = 0.7
loyalty_max = 1000.0
initial_loyalty = 700.0
# 府库支付不起开支时，每回合降低的忠诚度；按时支付时增加的忠诚度
unpaid_loyalty_penalty = 33.0
paid_loyalty_gain = 3.3

# 每名士人每回合的开支，由府库支付
[shi.upkeep]
grain = 0.033

[economy]
# 官营相对民营的生产效率
guan_efficiency = 0.5
default_tax_rate = 0.1
max_tax_rate = 0.5
# 所有者与管理者不是同一人时的产能
absentee_mult = 0.6
# 城市处于被攻占状态时的产能
occupied_mult = 0.75

[sacrifice]
# 每件礼器每次祭祀增加的文化值，越接近上限增加越少
culture_per_vessel = 5.0
culture_max = 1000.0

# 可用于祭祀的礼器，以及每件折合的件数：精品折合更多
[sacrifice.vessels]
ding = 1.0
gui = 1.0
ding_fine = 2.0
gui_fine = 2.0

[ritual]
# 列鼎制度中计数的礼器
ding_goods = ["ding", "ding_fine"]
# 每超出一只鼎扣除的风评。同一次僭越只扣一次，超出得更多时扣多出的部分
excess_reputation_penalty = 5.0
# 城市面积每超出一块地扣除的风评，规则同上
excess_tile_penalty = 2.0

# 各身份的用鼎上限
[ritual.ding_limit]
tianzi = 9
gong = 7
hou = 7
bo = 5
zi = 5
nan = 3
none = 1

# 各身份名下每座城市的地块上限
[ritual.tile_limit]
tianzi = 30
gong = 20
hou = 20
bo = 15
zi = 15
nan = 10
none = 7

[quality]
# 技能槽中有 1/2/3/4 项技能时，产出中精品的比例（只对设了 fine 的物品生效）
fine_share = [0.3, 0.15, 0.05, 0.0]

[loyalty]
# 人口对管理者个人的忠诚度。换管理者时归零重来，旧管理者攒下的不能带走
max = 1000.0
reset = 0.0
initial = 500.0
# 每回合：不收税时 +low_tax_gain，税率为上限时 -high_tax_loss（按税率和被征税比例折算），两者相抵
# 默认数值下，实际税率低于上限的 1/3（即 1/6）时忠诚度上升，高于时下降
low_tax_gain = 3.3
high_tax_loss = 10.0
# 赏赐民众：人均每 1 价值的财货，所有人群增加的忠诚度
grant_gain_per_value = 100.0
# 忠诚度低于 threshold 时开始出现下面的后果，越低越严重；下面各项是忠诚度为 0 时的值，中间线性插值
threshold = 300.0
# 官营罢工：派去官营生产、营建、开垦、水利的人只有这个比例肯出工，其余的人回去自主民营
guan_turnout = 0.5
# 民营的人不罢工，但收税只能收上来这个比例
tax_share = 0.5
# 民营的产量倍率
min_output = 0.8

[quota]
# 规定任务：所有者给管理者定每年要上缴的物资。管理者随时可以从府库上缴到所有者的私库，
# 每年年末（冬季最后一个月）结算，看全年累计交够没有，影响所有者对管理者的信任
initial_trust = 500.0
max_trust = 1000.0
complete_trust = 50.0
# 每种物资都交够、且总价值达到规定的 exceed_ratio 倍，算超额完成
exceed_ratio = 1.2
exceed_trust = 120.0
# 一点没交时降低的信任，按缺口比例（按价值折算）减少
fail_trust_penalty = 150.0

[fief]
# 封授与纳贡。封地封出去就不能收回；封臣不守本分只能作为征讨的理由
# 封君没有指定纳贡时，每年年末自动纳府库当年总产出的这个比例（按产出算，不按存量）
auto_rate = 0.1
# 封君也可以指定每年纳哪些物资、纳多少，取代自动纳贡。总价值超过府库一年总产出价值的这个比例，
# 就算过火：封臣可以拒绝，封地百姓会敌视封君
excessive_ratio = 0.3
hostility_max = 1000.0
# 过火的纳贡每回合增加的敌视：要的是上限的两倍时增加 hostility_gain，按超出的比例折算，最多再翻一倍
hostility_gain = 20.0
# 没有过火的纳贡时，敌视每回合消退的量
hostility_decay = 3.0
# 征讨的理由：封臣风评低于 low_reputation；合理的纳贡连续 shortfall_years 年没交够；最近一年内僭越过
low_reputation = 0.0
shortfall_years = 2

[passage]
# 通行权：别人的军队要经过一座城，需要这座城的所有者给通行权。通行权在赠与、索取、交易里给出，有期限，
# 不写期限时默认这么多回合
default_turns = 6

[neighbor]
# 邻城增益：同一个所有者的两座城，治所相距不超过 range 格，两座城的产出都增加 bonus。
# 邻城有几座就加几份，最多加到 max
range = 8
bonus = 0.05
max = 0.15

[reclaim]
# 开垦在春、夏、秋、冬的人力倍率。农忙的代价由 happiness.busy_penalty 和误了农时的收成体现
season_mult = [1.0, 1.0, 1.0, 1.0]

[learning]
# 学一项新技能需要的回合数，学习期间照常干活。丢弃技能、调整顺序当回合生效
turns = 1

# ---------------------------------------------------------------- 物品
