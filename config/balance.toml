# ---------------------------------------------------------------- 地块
# 地块之间没有主次之分：每块地都能住人、劳作、建建筑，区别只在能做哪一行
# 地图上的每一格就是一块地；symbol 是手画地图时代表这种地形的字（不能用「·」）
# housing：每块地能居住的人口；jobs：每块地能容纳劳作的人数
# 城市的居住上限 = 所有地块的 housing + 建筑的 housing，人口增长不会超过它
# building_slots：每块地能建几座建筑，官营和民营都算；建筑不影响这块地的居住和劳作
# reclaim_skill / reclaim_labor：把和城相邻的一格这种野地开垦进城，需要的技能和人力（人 × 回合）
#   开垦期间参与的人一直被占用，人力满后当回合到手；不填 reclaim_skill 的地开垦不了
# move_cost：军队走进这种地形的一格要花的行军力。不写 move_cost 的地形过不去（高山、大河），
#   也不能住人、劳作、开垦，不能属于城市
# defense_bonus：守在这种地形上的军队防御增加的比例

[terrains.farmland]
name = "耕地"
symbol = "耕"
housing = 50
jobs = 60
building_slots = 3
reclaim_skill = "farming"
reclaim_labor = 600000
move_cost = 1

