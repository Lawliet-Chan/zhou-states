# ---------------------------------------------------------------- 建筑
# labor：完成所需的总人力（人 × 回合）
# skill：参与营建的人口需要具备的技能，不填表示任何人都可以服劳役
# materials：开工时从府库扣除的材料
# 营建时要定下建成后是官营还是民营，之后不能改：
#   官营建筑里只能官营劳作，产出全部进府库，产能按 economy.guan_efficiency 折算
#   民营建筑里只能民营劳作，产出归民众，府库只能收税
#   facility 要求的建筑、jobs 提供的劳作位置都按经营方式区分；城墙、宫殿这类效果对全城生效，不分官营民营
# 营建本身一律由府库出材料、视为官营，参与者的愉悦度会下降
# 建筑效果（每座）：jobs 增加某个配方的劳作容量；housing 增加居住上限；
#   happiness 每回合给全城人群增加的愉悦度；shi_capacity_bonus 增加士人管理上限的比例
# terrains：只能建在这些地块上，不填表示哪里都能建。营建时要指定建在哪块地上

# 城墙：民有所依，安心度日。守城的作用等军队系统再做
[buildings.city_wall]
name = "城墙"
labor = 900000
season_mult = [1000, 1000, 1000, 1000]
happiness = 1000

[buildings.foundry]
name = "冶厂"
skill = "building"
labor = 360000
materials = { bronze = 5000 }
season_mult = [1000, 1000, 1000, 1000]

[buildings.market]
name = "市"
skill = "building"
labor = 300000
season_mult = [1000, 1000, 1000, 1000]
jobs = { trade = 40 }

# 宫殿：治所，士人办事更得力
[buildings.palace]
name = "宫殿"
skill = "building"
labor = 1200000
season_mult = [1000, 1000, 1000, 1000]
housing = 30
shi_capacity_bonus = 100

# ---------------------------------------------------------------- 地块改良
# 水利夏季汛期最难做，冬季枯水最好做
# 和营建一样按人力累积进度，视为官营；完成后这块地升一级
# terrains：可以改良的地块；yield_bonus：每级增加的产量比例
# 劳作时先占用产量高的地块

[improvements.irrigation]
name = "水利"
skill = "water"
labor = 450000
season_mult = [500, 200, 500, 1000]
terrains = ["farmland"]
max_level = 2
yield_bonus = 250

# ---------------------------------------------------------------- 军事
[military]
# 技能槽里有这项技能的人才能当兵；技能槽里只有这一项的是脱产精兵，平时由府库供养
skill = "martial"
# 完全没有必需装备的兵，战斗力只剩这个比例；装备不全时按缺的比例折算
unequipped_mult = 500

[combat]
# 战斗力 = 人数 × 兵种的攻击或防御 × 装备倍率 × 加成（带甲、地形、城墙）。没有随机，结果可复现
# 每点战斗力每次交战杀死对方的人数。近战时守方用防御力还手，远程攻击对方不能还手
lethality = 100
# 远程攻击（弓矢、攻城机）的距离：隔一格
ranged_range = 2
# 全军带甲时防御增加的比例，带了一部分按比例算
armor_bonus = 500
# 守城墙的兵还手时战斗力增加的比例
wall_bonus = 1000

[siege]
# 城里有这种建筑才算有城墙；没建成的城墙等于没有城墙
wall_building = "city_wall"
wall_hp = 200000
center_hp = 20000
# 攻城机：步兵带着，隔一格就能打城墙。每架每次攻击打掉的防御值
engine_good = "siege_engine"
engine_damage = 5000
# 不用攻城机时，每点战斗力打掉的城墙、城中心防御值
wall_rate = 10
center_rate = 100
# 修城墙：城墙不会自己回血，要派工人修；这回合挨了打就修不了
repair_skill = "building"
repair_per_100 = 10000

[occupation]
# 城中人群对占领者的初始忠诚度 = base_loyalty + 管城者风评 × reputation_mult（这项最多 reputation_max）
#   + 对旧主的忠诚度低于 grudge_below 时，每低 1 点加 grudge_mult（这项最多 grudge_max）。最高为忠诚度满值
base_loyalty = 300000
reputation_mult = 5000
reputation_max = 400000
grudge_below = 300000
grudge_mult = 500
grudge_max = 150000

[war]
# 国与国之间（含同一国的封臣之间）没有理由就开战，扣这么多风评。牵涉无国籍的人不用理由
unjustified_penalty = 20000
# 讲和之后双方多少回合内不能再开战
truce_turns = 12
# 国战结束时封臣还没去打国君指定的城，扣的风评；也成为国君征讨他的理由
task_penalty = 10000
# 国君制止封臣之间的战争后，封臣每动手一次扣的风评；也成为国君征讨他的理由
defy_penalty = 10000

[supply]
# 出征（离开自己的城的地）的军队靠粮道供粮，粮从起点城的府库出，按全城人口的消耗标准算
# 走粮道的兵种和人数：一条粮道固定这么多辎重兵，和粮道长短、前线人数无关
unit = "supply"
convoy = 2
# 粮道每多一格，军粮（连辎重兵在内）多耗这个比例
per_cell = 50
# 断粮的第 n 个回合，战斗力再降 n × starve_rate：100 时依次剩 90%、70%、40%，第 4 回合溃散
starve_rate = 100

[vision]
# 此身份国君所属国家的都城作为公共地标
public_capital_rank = "tianzi"
# 战争迷雾：每个人只看得到自己视野内的东西，视野不共享。未探索地形不公开
# 自己拥有、管理、攻占的城：城的地块再往外几格
city = 2
# 自己统领的军队：所在的格子再往外几格；兵种可以用 vision 另设，一支军队取看得最远的
army = 2

# 别人的城只看得到大致人口
[[vision.tiers]]
min = 0
name = "小邑"

[[vision.tiers]]
min = 300
name = "中邑"

[[vision.tiers]]
min = 1000
name = "大邑"

[plunder]
# 占领者劫掠府库或市民，可以按物品类别挑着抢，不挑就全拿；每座城每回合只能劫掠一次
# 劫掠市民：所有人群的愉悦度、对占领者的忠诚度降低，占领者扣风评。按抢走的价值占民间财富的比例打折
# 劫掠府库没有代价
happiness_loss = 300000
loyalty_loss = 300000
reputation_loss = 10000

# 兵种。gear：必需的装备，每人多少件；optional：可以选带的装备，每人多少件。
# 编军队时装备从府库领，精品也算（比如精兵算兵器）；遣散时还回府库
# moves：每回合的行军力，走进一格花掉这一格地形的 move_cost；terrain_cost：这个兵种走某些地形的耗时，取代 move_cost
# 一支军队混了几个兵种，行军力取最小的，每一格的耗时取最大的。行军力不够走下一格时，满行军力也能走一格
# attack / defense：每人的近战攻击、防御；ranged：带了弓矢的人每人的远程攻击
# move_after_attack：打完还能接着走（骑兵）
# 车兵：一乘战车三人、四匹马
[units.chariot]
name = "车兵"
gear = { chariot = 333, horse = 1333 }
moves = 3
attack = 3000
defense = 2000
terrain_cost = { forest = 3, water = 3, copper_mine = 3, jade_mine = 3 }

# 步兵：有兵器就能近战；带甲更好；带弓矢就是远程兵；带攻城机能攻城墙（每 50 人一架）
[units.infantry]
name = "步兵"
gear = { weapon = 1000 }
optional = { armor = 1000, bow = 1000, siege_engine = 20 }
moves = 2
attack = 1000
defense = 1000
ranged = 1000

[units.cavalry]
name = "骑兵"
gear = { horse = 1000 }
moves = 4
attack = 2000
defense = 1000
move_after_attack = true
vision = 3

# 辎重：不需要装备，在粮道上运粮
[units.supply]
name = "辎重"
moves = 2
attack = 200
defense = 300
