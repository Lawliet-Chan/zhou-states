# ---------------------------------------------------------------- 地块
# 地块之间没有主次之分：每块地都能住人、劳作、建建筑，区别只在能做哪一行
# 地图上的每一格就是一块地；symbol 是手画地图时代表这种地形的字（不能用「·」）
# housing：每块地能居住的人口；jobs：每块地能容纳劳作的人数
# 城市的居住上限 = 所有地块的 housing + 建筑的 housing，人口增长不会超过它
# building_slots：每块地能建几座建筑，官营和民营都算；建筑不影响这块地的居住和劳作
# reclaim_skill / reclaim_labor：把和城相邻的一格这种野地开垦进城，需要的技能和人力（人 × 回合）
#   开垦期间参与的人一直被占用，人力满后当回合到手；不填 reclaim_skill 的地开垦不了

[terrains.farmland]
name = "耕地"
symbol = "耕"
housing = 50
jobs = 60
building_slots = 3
reclaim_skill = "farming"
reclaim_labor = 600.0

[terrains.water]
name = "水泽"
symbol = "泽"
housing = 50
jobs = 30
building_slots = 3
reclaim_skill = "fishing"
reclaim_labor = 450.0

[terrains.forest]
name = "山林"
symbol = "林"
housing = 50
jobs = 30
building_slots = 3
reclaim_skill = "hunting"
reclaim_labor = 450.0

[terrains.salt_pond]
name = "盐池"
symbol = "盐"
housing = 50
jobs = 30
building_slots = 3
reclaim_skill = "salt_making"
reclaim_labor = 600.0

[terrains.copper_mine]
name = "铜矿"
symbol = "铜"
housing = 50
jobs = 30
building_slots = 3
reclaim_skill = "smelting"
reclaim_labor = 900.0

[terrains.jade_mine]
name = "玉矿"
symbol = "玉"
housing = 50
jobs = 20
building_slots = 3
reclaim_skill = "luxury"
reclaim_labor = 900.0

[terrains.pasture]
name = "草场"
symbol = "草"
housing = 50
jobs = 30
building_slots = 3
reclaim_skill = "horse_breeding"
reclaim_labor = 450.0

# ---------------------------------------------------------------- 配方
# outputs：每人每回合的产出；inputs：每人每回合消耗的原料
# 实际数量 = 每人数值 × 人数 × 季节倍率 × 专精度 × 愉悦度倍率 × 城市产能（× 官营效率）
# resource：劳作所在的地块，人数受这种地块的 jobs 总和限制；facility：城市必须拥有的建筑
# base_jobs：不靠地块的配方，不需要建筑也能容纳的人数；建筑可以用 jobs 增加容量
#   既没有 resource、base_jobs，也没有建筑提供容量的配方不限人数
# min_specialization：专精度低于该值的人群做不了
# season_mult：春、夏、秋、冬的倍率
# sowing_season：播种的季节（0 为春），这一季只播种；其他季节的收成不超过播种量

# 春天播种不产粮，记下种了多少；秋天收获，能收的人数不超过春天平均播种的人数。
# 春天把农人调走，秋天就收不满；秋天把农人调走，地里的庄稼收不回来。以后不同的五谷再分各自的耕收季节
[recipes.grain]
name = "种五谷"
skill = "farming"
resource = "farmland"
outputs = { grain = 0.01667 }
season_mult = [0.0, 0.0, 3.0, 0.0]
sowing_season = 0

[recipes.fish]
name = "捕鱼"
skill = "fishing"
resource = "water"
outputs = { fish = 0.01 }
season_mult = [1.0, 1.0, 1.0, 0.3]

[recipes.salt]
name = "制盐"
skill = "salt_making"
resource = "salt_pond"
outputs = { salt = 0.06667 }
season_mult = [1.0, 1.0, 1.0, 0.5]

[recipes.hunt]
name = "狩猎"
skill = "hunting"
resource = "forest"
outputs = { meat = 0.006667, hide = 0.003333 }
season_mult = [1.0, 1.0, 1.0, 1.0]

[recipes.horse]
name = "驯马"
skill = "horse_breeding"
resource = "pasture"
outputs = { horse = 0.001667 }
season_mult = [1.0, 1.0, 1.0, 0.5]

[recipes.bronze]
name = "冶青铜"
skill = "smelting"
resource = "copper_mine"
facility = "foundry"
outputs = { bronze = 0.006667 }
season_mult = [1.0, 1.0, 1.0, 1.0]

[recipes.weapon]
name = "铸兵器"
skill = "armory"
facility = "foundry"
inputs = { bronze = 0.003333 }
outputs = { weapon = 0.003333 }
season_mult = [1.0, 1.0, 1.0, 1.0]

[recipes.armor]
name = "制甲"
skill = "armory"
inputs = { hide = 0.006667 }
outputs = { armor = 0.003333 }
season_mult = [1.0, 1.0, 1.0, 1.0]

[recipes.ding]
name = "铸鼎"
skill = "ritual_craft"
facility = "foundry"
min_specialization = 0.85
inputs = { bronze = 0.006667 }
