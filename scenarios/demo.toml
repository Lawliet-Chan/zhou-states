# 示例剧本：四座城。周王是天子，有成周；卫伯是卫国国君。
# 玩家姬虎是卫国人：邶是卫伯封给他的封地，每年按例纳贡；鄘是他自己的城，交给家宰史伯管、每年上缴粮食。
# 用 key 互相引用；workers 中的数字是投入的人数。

# 地图：每格写地形的 symbol（见 balance.toml），奇数行向右缩进半格，「·」表示没有格子。
# 「山」是高山、「河」是大河，军队过不去，只能画在野地上。
# owners 一层画出每格属于哪座城（城名的第一个字），「·」是野地，可以从相邻的城开垦进来。
[map]
rows = [
  "林 林 草 耕 耕 林 山 山 玉",
  " 林 耕 耕 耕 耕 耕 耕 泽 玉",
  "铜 耕 耕 耕 河 泽 耕 耕 耕",
  " 盐 耕 泽 耕 河 耕 林 耕 林",
  "盐 林 耕 耕 林 林 耕 耕 草",
  " 林 山 山 耕 林 铜 耕 草 草",
]
owners = [
  "· · 鄘 鄘 鄘 鄘 · · ·",
  " · · · 鄘 · · · 卫 卫",
  "邶 邶 邶 · · · 卫 卫 卫",
  " 邶 邶 邶 · · · · 卫 ·",
  "· 邶 邶 · · · 成 成 ·",
  " · · · · · 成 成 成 ·",
]

[[countries]]
key = "zhou"
name = "周"
ruler = "king"
capital = "chengzhou"

[[countries]]
key = "wei_state"
name = "卫"
ruler = "wei_bo"
capital = "wei"

[[characters]]
key = "king"
name = "周王"
rank = "tianzi"
reputation = 800

[[characters]]
key = "player"
name = "姬虎"
rank = "nan"
reputation = 500
nationality = "wei_state"

[[characters]]
key = "steward"
name = "史伯"
nationality = "wei_state"

[[characters]]
key = "wei_bo"
name = "卫伯"
rank = "bo"
reputation = 300

[[cities]]
key = "bei"
name = "邶"
owner = "player"
manager = "player"
# 卫伯封给姬虎的封地，没有指定纳贡，年末按例纳府库当年产出的一部分
liege = "wei_bo"
totem = "玄鸟"
seat = [1, 3]
# 官营冶厂给府库铸兵器，民营冶厂供工匠自己冶铜
guan_buildings = { foundry = 1 }
min_buildings = { foundry = 1 }
treasury = { grain = 20, salt = 5, bronze = 40, hide = 10, gui = 2 }
private_wealth = { grain = 16, salt = 7 }
tax_rate = 0.1

[[cities.groups]]
key = "dongguo"
name = "东郭农人"
size = 160
skills = ["farming", "weaving"]
culture = 100
happiness = 600

[[cities.groups]]
key = "nanli"
name = "南里农人"
size = 80
skills = ["farming"]
culture = 100
happiness = 600

[[cities.groups]]
key = "yanhu"
name = "盐户"
size = 20
skills = ["salt_making", "fishing"]
culture = 80
happiness = 550

[[cities.groups]]
key = "xishi"
name = "西市工匠"
size = 30
skills = ["smelting", "armory"]
culture = 120
happiness = 600

[[cities.groups]]
key = "shizu"
name = "士族"
size = 10
skills = ["shi", "ritual_craft"]
culture = 300
happiness = 650

[[cities.groups]]
key = "shangjia"
name = "商贾"
size = 15
skills = ["commerce"]
culture = 100
happiness = 600

[[cities.groups]]
key = "hegong"
name = "河工"
size = 10
skills = ["water", "farming"]
culture = 90
happiness = 600

[[cities.officials]]
key = "jia"
name = "士甲"
from_group = "shizu"

[[cities.officials]]
key = "yi"
name = "士乙"
from_group = "shizu"

[[cities.officials]]
key = "bing"
name = "士丙"
from_group = "shizu"

[[cities.officials]]
key = "ding"
name = "士丁"
from_group = "shizu"

# 士甲：带东郭农人民营种五谷
[[cities.assignments]]
key = "farm"
shi = "jia"
task = { kind = "produce", recipe = "grain", mode = "min" }
workers = { dongguo = 35 }

# 士乙：向东郭农人收税
[[cities.assignments]]
key = "tax"
shi = "yi"
task = { kind = "collect_tax" }
workers = { dongguo = 35 }

# 士丙：官营铸兵器
[[cities.assignments]]
key = "arms"
shi = "bing"
task = { kind = "produce", recipe = "weapon", mode = "guan" }
workers = { xishi = 30 }

# 士丁：征调南里农人修城墙
[[cities.assignments]]
key = "wall"
shi = "ding"
task = { kind = "construct", building = "city_wall", mode = "guan", on = "farmland" }
workers = { nanli = 35 }

